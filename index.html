<head>

<style>
:root{
  /* Layout: one calm phone-width column; the finished week opens into two columns on wide screens. */
  --bg:#F2F9F3;
  --surface:#FFFFFF;
  --ink:#1F3A2D;
  --muted:#5C7868;
  --leaf:#8FD3A8;
  --leaf-soft:#DFF3E5;
  --leaf-deep:#26784C;
  --line:#D9EADF;
  --note:#FBF3E2;
  --note-ink:#6B5521;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--leaf-deep);outline-offset:2px;border-radius:10px}

.app{max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));min-height:100%;display:flex;flex-direction:column;gap:22px}
.app.wide{max-width:1000px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
.brand svg{width:32px;height:32px;flex:none}
.stepno{font-size:13px;color:var(--muted);font-weight:500}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar i{height:6px;border-radius:6px;background:var(--line);transition:background .3s}
.bar i.on{background:var(--leaf-deep)}

h1{font-family:var(--display);font-weight:500;font-size:32px;line-height:1.12;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.lead{color:var(--muted);font-size:17px}
.head{display:flex;flex-direction:column;gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.group{display:flex;flex-direction:column;gap:10px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;background:var(--leaf-soft)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:36px;max-width:9em}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text]{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px;width:100%}
input[type=text]:focus{outline:none;border-color:var(--leaf-deep);box-shadow:0 0 0 4px var(--leaf-soft)}
.stepper{display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:6px;width:max-content}
.stepper button{width:42px;height:42px;border-radius:10px;border:0;background:var(--leaf-soft);font-size:22px;font-weight:600;line-height:1}
.stepper button:disabled{opacity:.4;cursor:default}
.stepper output{min-width:92px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips.one{grid-template-columns:1fr}
.chip{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:13px 14px;min-height:54px;transition:background .15s,border-color .15s,transform .1s}
.chip:active{transform:scale(.98)}
.chip .tick{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.chip .tick svg{width:12px;height:12px;opacity:0}
.chip .t{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.chip b{font-weight:600}
.chip small{color:var(--muted);font-size:13px;line-height:1.3}
.chip[aria-pressed=true]{background:var(--leaf-soft);border-color:var(--leaf-deep)}
.chip[aria-pressed=true] .tick{background:var(--leaf-deep);border-color:var(--leaf-deep)}
.chip[aria-pressed=true] .tick svg{opacity:1}

.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,rgba(242,249,243,0));padding:26px 20px calc(18px + env(safe-area-inset-bottom))}
.dock .in{max-width:440px;margin:0 auto;display:flex;gap:10px}
.btn{border:0;border-radius:16px;padding:15px 20px;font-weight:700;font-size:17px;background:var(--leaf-deep);color:#fff;flex:1;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);flex:none}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:12px;flex:none}
.fine{font-size:13px;color:var(--muted)}

.cols{display:grid;gap:22px}
@media (min-width:880px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--leaf-soft);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.days li{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.nut{text-align:right;font-size:12px;line-height:1.45;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.nut b{display:block;font-size:15px;color:var(--ink);font-weight:700}
.nut span{display:block}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tiles div{background:var(--leaf-soft);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;color:var(--muted)}
.tiles b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.days .d{padding-top:3px;display:flex;flex-direction:column;gap:2px}
.days .d small{font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);white-space:nowrap}
.days li.today{background:var(--leaf-soft);border-radius:14px;border-top-color:transparent;padding-left:10px;padding-right:10px;margin:0 -10px}
.days li.today + li{border-top-color:transparent}
.days li.today .d{color:var(--leaf-deep)}
.done{background:var(--leaf-soft);border:2px solid var(--leaf-deep);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.done h2{font-size:22px}
.done p{color:var(--ink)}
.fb{display:flex;flex-wrap:wrap;gap:8px}
.fb button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px}
.fb button[aria-pressed=true]{background:var(--leaf-soft);border-color:var(--leaf-deep)}
.demo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.streak{display:flex;align-items:center;gap:12px;background:var(--note);color:var(--note-ink);border-radius:18px;padding:12px 16px;max-width:460px}
.streak svg{width:30px;height:30px;flex:none}
.streak b{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.streak .st{display:flex;flex-direction:column;font-size:14px;line-height:1.35}
.streak .st strong{font-weight:700}
.days .body{display:flex;flex-direction:column;gap:8px}
.days .acts{display:flex;flex-wrap:wrap;gap:8px}
.days li:first-child{border-top:0;padding-top:0}
.days .d{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf-deep)}
.days .n{font-weight:600;line-height:1.3}
.days .m{font-size:13px;color:var(--muted)}
.swap{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}
.swap.rec{background:var(--leaf-soft);border-color:var(--leaf-soft);color:var(--leaf-deep)}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(31,58,45,.38);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:28px 28px 0 0;padding:24px 22px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(16px)}to{transform:none}}
@media (min-width:620px){.sheet{align-items:center}.panel{border-radius:28px}}
.panel .phead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.panel h2{font-size:25px;font-weight:500;line-height:1.15}
.close{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--leaf-soft);font-size:22px;line-height:1;color:var(--leaf-deep)}
.ingr{list-style:none;margin:0;padding:0}
.ingr li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.ingr li:first-child{border-top:0}
.ingr b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf-deep);font-weight:700;font-size:14px;display:grid;place-items:center}
.meals{display:flex;flex-direction:column;gap:8px;font-size:15px}
.meals b{font-weight:600}
.meals span{color:var(--muted)}

.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--leaf);border-radius:8px;transition:width .25s}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list label{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.list li:first-child label{border-top:0}
.list input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);margin:0;display:grid;place-items:center;cursor:pointer}
.list input:checked{background:var(--leaf-deep);border-color:var(--leaf-deep)}
.list input:checked::after{content:"";width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.list .q{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.list .q small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.list input:checked ~ span{color:var(--muted);text-decoration:line-through}
.pantry{display:flex;flex-wrap:wrap;gap:6px}
.pantry span{border:1px dashed var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted)}
.note{background:var(--note);color:var(--note-ink);border-radius:16px;padding:14px 16px;font-size:14px}
.list li.isnew label{background:var(--leaf-soft);border-radius:12px;border-top-color:transparent;margin:0 -8px;padding-left:8px;padding-right:8px}
.list li.isnew + li label{border-top-color:transparent}
.pill{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--leaf-deep);color:#fff;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px;text-decoration:none;display:inline-block}
.pill.mer{background:var(--note-ink)}
.days li.free .n{color:var(--muted)}
.days li.free .d{color:var(--muted)}
.days li.today.free .d{color:var(--leaf-deep)}
.swap.locked{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.dish{border:0;background:none;padding:0;margin:0;text-align:left;font:inherit;color:var(--ink);font-weight:600;line-height:1.3;text-decoration:underline;text-decoration-color:var(--leaf);text-decoration-thickness:2px;text-underline-offset:3px}
.dish:hover{text-decoration-color:var(--leaf-deep)}
.mealhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.mini.on{border-color:var(--leaf-deep);color:var(--leaf-deep)}
.notebtn{border:0;background:none;padding:2px 0;margin:0;text-align:left;font:inherit;color:inherit;display:block}
.notebtn .link{color:var(--leaf-deep);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.notebtn .mine{font-weight:600;color:var(--ink);font-size:15px}
.noteedit{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.noteedit input{padding:10px 12px;font-size:16px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;padding:11px 14px;font-size:16px}
.rm{border:0;background:transparent;width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;color:var(--muted)}
.rm:hover{background:var(--leaf-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.explain{font-size:14px;color:var(--muted);margin:0}
.sfoot{position:sticky;bottom:-26px;background:var(--surface);padding:12px 0 4px;display:flex;gap:10px;border-top:1px solid var(--line)}
.sfoot .btn{flex:1}
.fr span small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.fr span small.chk{color:var(--note-ink);font-weight:600}
.fr span small.old{color:#9a3b2a;font-weight:600}
.fr .mini{margin-top:6px}
.fromfr{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;font-weight:600;color:var(--leaf-deep);background:var(--leaf-soft);border-radius:999px;padding:3px 10px 3px 8px;line-height:1.3}
.fromfr svg{width:12px;height:12px;flex:none}
.fromfr.soon{background:var(--note);color:var(--note-ink)}
.ingr .home{font-size:11px;font-weight:700;color:var(--leaf-deep);background:var(--leaf-soft);border-radius:999px;padding:1px 7px;margin-left:6px}
.fr span small.use{color:var(--leaf-deep);font-weight:600}
.frq{display:flex;align-items:center;gap:4px;white-space:nowrap}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chipx{display:inline-flex;align-items:center;gap:2px;background:var(--leaf-soft);border-radius:999px;padding:2px 2px 2px 12px;font-size:14px;font-weight:600}
input[type=number]{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;font-size:16px;-moz-appearance:textfield;appearance:textfield}
input[type=number]:focus{outline:none;border-color:var(--leaf-deep);box-shadow:0 0 0 4px var(--leaf-soft)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.unit{align-self:center;font-size:14px;color:var(--muted);min-width:24px}
.tour-target{position:relative;z-index:20;background:var(--surface);border-radius:16px;box-shadow:0 0 0 4px var(--leaf-deep),0 0 0 200vmax rgba(20,40,30,.45)}
.tour{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;background:var(--surface);border-radius:20px;padding:18px 18px 16px;z-index:30;display:none;flex-direction:column;gap:8px;box-shadow:0 12px 32px rgba(0,0,0,.28);animation:up .22s ease-out}
.tour.show{display:flex}
.tour .stp{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tour h2{font-size:21px}
.tour p{font-size:16px;line-height:1.45}
.tour .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.tour .dots{display:flex;gap:5px}
.tour .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tour .dots i.on{background:var(--leaf-deep)}
.help{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;color:var(--leaf-deep)}
.notice .tip{background:var(--leaf-soft);color:var(--ink);border-radius:12px;padding:8px 10px;margin-top:2px}
.notice{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto;background:var(--surface);border:1.5px solid var(--leaf-deep);border-radius:20px;padding:16px 18px;box-shadow:0 12px 32px rgba(31,58,45,.2);display:none;flex-direction:column;gap:8px;z-index:9;animation:up .22s ease-out}
.notice.show{display:flex}
.notice .h{font-size:18px;font-weight:700}
.notice .meal{font-size:14px;color:var(--muted)}
.notice .small{font-size:13px;color:var(--muted);line-height:1.45;display:flex;flex-direction:column;gap:2px}
.notice .small b{color:var(--ink);font-weight:600}
.notice .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.loading{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.loading svg{width:220px;height:auto;max-width:70%}
.loading .status{color:var(--muted);font-size:17px;min-height:1.5em}
.loading .prog{width:min(260px,80%)}
.loading .prog i{width:100%;transform-origin:left;animation:fill 2.9s linear both}
.drop{animation:drop 2.4s cubic-bezier(.45,0,.7,1) infinite backwards}
.drop.d2{animation-delay:.6s}.drop.d3{animation-delay:1.2s}.drop.d4{animation-delay:1.8s}
@keyframes drop{0%{transform:translateY(-62px);opacity:0}12%{opacity:1}58%{transform:translateY(62px);opacity:1}59%,100%{transform:translateY(62px);opacity:0}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
#view{animation:rise .3s ease-out;display:flex;flex-direction:column;gap:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.chips{grid-template-columns:1fr}h1{font-size:28px}.hero h1{font-size:30px}}
</style>

<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 320 320" aria-hidden="true"><rect width="320" height="320" rx="76" fill="#DFF3E5"/><path d="M104 104V176A56 56 0 0 0 216 176V104" fill="none" stroke="#26784C" stroke-width="36" stroke-linecap="round"/><path d="M216 92C212 58 232 36 264 32C270 64 250 90 216 92Z" fill="#5DB884"/></svg>
      Ukekurv
    </div>
    <div class="stepno" id="stepno"></div>
  </header>
  <div class="bar" id="bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <main id="view"></main>
</div>
<div class="sheet" id="sheet"></div>
<div class="tour" id="tour" role="dialog" aria-modal="false" aria-labelledby="tourtitle"></div>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/*LOGIC-START*/
// Ingredient: [name, category, unit, allergens, level, pack]

"avokado gulost feta parmesan mozzarella halloumi flote kokosmelk pesto peanottsmor notter hummus".split(" ").forEach(function(id){ROLE[id]="fat";});
"kyllingdeig roktlaks kylling karbonade kjottdeig biff kalkun laks torsk reker fiskekaker plantebiff egg tofu cottage skyr kesam yoghurt linser kikerter svartebonner kidney edamame tunfisk makrell".split(" ").forEach(function(id){ROLE[id]="prot";});
var MULT = {lett:{carb:.7,fat:.7,prot:1},vanlig:{carb:1,fat:1,prot:1},mer:{carb:1.3,fat:1.15,prot:1.25}};
// Amount per person after the goal is applied. Lefser and pita stay in halves.
function scaleQ(id,q,goal){
  var m=(MULT[goal]||MULT.vanlig)[ROLE[id]]||1, v=q*m;
  if(m!==1 && (id==="tortilla"||id==="pita")) v=Math.max(.5,Math.round(v*2)/2);
  return v;
}
function prep(list){
  list.forEach(function(r){
    r.ing = r.i.trim().split(/\s+/).map(function(x){var a=x.split(":");return [a[0],parseFloat(a[1])];});
    r.pan = r.p ? r.p.trim().split(/\s+/) : [];
    var lv=0, al={};
    r.ing.map(function(x){return x[0];}).concat(r.pan).forEach(function(id){
      var g=ING[id]; if(!g) throw new Error("Ukjent ingrediens: "+id);
      if(g[4]>lv) lv=g[4];
      g[3].split(" ").forEach(function(a){ if(a) al[a]=1; });
    });
    r.level=lv; r.al=Object.keys(al);
  });
}
prep(DINNERS); prep(BREAKFASTS); prep(LUNCHES);

function dietLevel(d){ for(var k=0;k<DIETS.length;k++) if(DIETS[k][0]===d) return DIETS[k][3]; return 3; }
function ok(r,prof){
  if(r.level>dietLevel(prof.diet)) return false;
  for(var k=0;k<r.al.length;k++) if(prof.allergens.indexOf(r.al[k])>=0) return false;
  return true;
}
function overlap(a,b){ var n=0; a.forEach(function(x){ if(b.indexOf(x)>=0) n++; }); return n; }
function styleTags(r){ var s=(r.s||[]).slice(); if(r.t && r.t<=20 && s.indexOf("rask")<0) s.push("rask"); return s; }

// seen: dinners used in earlier weeks, oldest first. They are only picked when nothing new is left.
function pickDinners(prof,rnd,seen){
  seen=seen||[];
  var lv=dietLevel(prof.diet);
  var c=[],fresh=0;
  DINNERS.forEach(function(r,idx){
    if(!ok(r,prof)) return;
    var sc=3*overlap(r.l,prof.likes)+2*overlap(styleTags(r),prof.styles)+rnd()*2.5;
    if(prof.have && prof.have.length) sc+=1.5*r.ing.filter(function(x){return prof.have.indexOf(x[0])>=0;}).length;
    // Meat, fish and salad at home that must be used soon: these dinners come first, even if you had them lately.
    var soon=prof.haveSoon?r.ing.filter(function(x){return prof.haveSoon.indexOf(x[0])>=0;}).length:0;
    if(soon) sc+=6*soon;
    if(lv===2 && r.level===2) sc+=1.5;
    if(prof.goal==="lett"||prof.goal==="mer"){
      var n=nutrition(idx,prof.goal);
      if(prof.goal==="lett") sc+=8*(4*n.p/n.kcal)+(n.kcal<=500?1.5:0);
      else sc+=(n.kcal-500)/120;
    }
    var at=seen.indexOf(idx);
    if(at>=0) sc-=soon?3+0.5*at:100+4*at; else fresh++;
    c.push({idx:idx,sc:sc});
  });
  var picked=[];
  while(picked.length<7 && c.length){
    var best=-1,bv=-1e9;
    c.forEach(function(x,k){
      var r=DINNERS[x.idx],pen=0;
      picked.forEach(function(pi){
        var q=DINNERS[pi];
        if(r.l[0] && r.l[0]===q.l[0]) pen+=2;
        if(r.ing[0][0]===q.ing[0][0]) pen+=1.5;
        if(r.n.split(" ")[0]===q.n.split(" ")[0]) pen+=3;
      });
      if(x.sc-pen>bv){bv=x.sc-pen;best=k;}
    });
    picked.push(c.splice(best,1)[0].idx);
  }
  var unique=picked.length;
  for(var k=0;picked.length<7 && unique>0;k++) picked.push(picked[k%unique]);
  c.sort(function(a,b){return b.sc-a.sc;});
  return {dinners:picked,reserve:c.map(function(x){return x.idx;}),unique:unique,fresh:fresh,pool:fresh+seen.filter(function(i){return ok(DINNERS[i],prof);}).length};
}
function pickMeals(list,prof,rnd,prev){
  var c=[],was=(prev||[]).map(function(m){return m.idx;});
  list.forEach(function(r,idx){ if(ok(r,prof)) c.push({idx:idx,sc:2*overlap(styleTags(r),prof.styles)+((prof.goal==="lett"||prof.goal==="mer")&&r.s.indexOf("protein")>=0?1.5:0)+rnd()*1.5-(was.indexOf(idx)>=0?4:0)}); });
  c.sort(function(a,b){return b.sc-a.sc;});
  if(!c.length) return [];
  if(c.length===1) return [{idx:c[0].idx,days:7}];
  return [{idx:c[0].idx,days:4},{idx:c[1].idx,days:3}];
}
function pickSnacks(prof){
  var s=[["eple",3],["banan",2]], lv=dietLevel(prof.diet), al=prof.allergens;
  var skyrOk=lv>=1 && al.indexOf("melk")<0, nutOk=al.indexOf("notter")<0;
  if(prof.goal==="lett"){ if(skyrOk) s.push(["skyr",3]); else s.push(["gulrot",4]); }
  else if(prof.styles.indexOf("protein")>=0 && skyrOk) s.push(["skyr",3]);
  else if(nutOk) s.push(["notter",100]);
  else { s.push(["gulrot",3]); s.push(["hummus",.5]); }
  if(prof.goal==="mer" && nutOk && s.every(function(x){return x[0]!=="notter";})) s.push(["notter",100]);
  return s;
}
function makePlan(prof,rnd,seen,prev){
  rnd=rnd||Math.random; prev=prev||{};
  var d=pickDinners(prof,rnd,seen);
  return {dinners:d.dinners,reserve:d.reserve,unique:d.unique,fresh:d.fresh,pool:d.pool,bf:pickMeals(BREAKFASTS,prof,rnd,prev.bf),lu:pickMeals(LUNCHES,prof,rnd,prev.lu),snacks:pickSnacks(prof)};
}
// The amount a recipe shows for one ingredient. The shopping list adds up exactly these numbers.
function amt(q,unit){
  if(unit==="g") return Math.max(5,Math.round(q/5)*5);
  return Math.max(.25,Math.round(q*4)/4);
}
// Free days: day indexes (0-6) with no dinner to shop for. Old plans have none.
function isFree(plan,k){ return !!(plan.free && plan.free.indexOf(k)>=0); }
function freeDays(n){ var f=[]; for(var k=Math.max(3,Math.min(7,n||7));k<7;k++) f.push(k); return f; }
function totals(plan,persons,goal){
  var t={},pan={};
  function add(r,mult){
    r.ing.forEach(function(x){ t[x[0]]=(t[x[0]]||0)+scaleQ(x[0],x[1],goal)*mult; });
    r.pan.forEach(function(id){ pan[id]=1; });
  }
  plan.dinners.forEach(function(i,k){
    if(isFree(plan,k)) return;
    var r=DINNERS[i];
    r.ing.forEach(function(x){ t[x[0]]=(t[x[0]]||0)+amt(scaleQ(x[0],x[1],goal)*persons,ING[x[0]][2]); });
    r.pan.forEach(function(id){ pan[id]=1; });
    pan.salt=1; pan.pepper=1;
  });
  if(!plan.noBf) plan.bf.forEach(function(m){ add(BREAKFASTS[m.idx],persons*m.days); });
  if(!plan.noLu) plan.lu.forEach(function(m){ add(LUNCHES[m.idx],persons*m.days); });
  plan.snacks.forEach(function(s){ t[s[0]]=(t[s[0]]||0)+s[1]*persons; });
  return {items:t,pantry:Object.keys(pan)};
}
function num(v){ return String(v).replace(".",","); }
function fmt(id,total){
  var g=ING[id],unit=g[2],pack=g[5];
  total=Math.round(total*1000)/1000;
  if(pack){ return {main:Math.ceil(total/pack[0])+" "+pack[1],sub:Math.ceil(total)+" "+unit}; }
  if(unit==="g"){ var v=Math.ceil(total/50)*50; return {main:v>=1000?num(v/1000)+" kg":v+" g"}; }
  if(unit==="dl"){ var d=Math.ceil(total*2)/2; return {main:d>=10?num(d/10)+" l":num(d)+" dl"}; }
  var c=Math.ceil(total);
  return {main:c+" "+(unit==="boks"&&c>1?"bokser":unit)};
}
// What the list tells you to buy, as a number in the ingredient's own unit (mirrors fmt).
function boughtQty(id,total){
  var g=ING[id],unit=g[2],pack=g[5];
  total=Math.round(total*1000)/1000;
  if(pack) return Math.ceil(total/pack[0])*pack[0];
  if(unit==="g") return Math.ceil(total/50)*50;
  if(unit==="dl") return Math.ceil(total*2)/2;
  return Math.ceil(total);
}
// have: amounts already at home, by ingredient id. They are taken off what you need to buy.
function grouped(plan,persons,goal,have){
  var tt=totals(plan,persons,goal),out=[],hv={},fromHave=[];
  if(have) Object.keys(tt.items).forEach(function(id){
    var h=Math.min(have[id]||0,tt.items[id]);
    if(h<=1e-9) return;
    if(tt.items[id]-h<=1e-9){ fromHave.push({id:id,name:ING[id][0],main:qty(h,ING[id][2])}); delete tt.items[id]; }
    else { tt.items[id]-=h; hv[id]=h; }
  });
  CATS.forEach(function(c){
    var rows=Object.keys(tt.items).filter(function(id){return ING[id][1]===c[0];})
      .sort(function(a,b){return ING[a][0].localeCompare(ING[b][0],"nb");})
      .map(function(id){var f=fmt(id,tt.items[id]),sub=f.sub||"";
        if(hv[id]) sub=(sub?sub+" · ":"")+qty(hv[id],ING[id][2])+" hjemme";
        return {id:id,name:ING[id][0],main:f.main,sub:sub,tot:tt.items[id]};});
    if(rows.length) out.push({key:c[0],label:c[1],rows:rows});
  });
  fromHave.sort(function(a,b){return a.name.localeCompare(b.name,"nb");});
  return {groups:out,fromHave:fromHave,pantry:tt.pantry.map(function(id){return {id:id,name:ING[id][0]};}).sort(function(a,b){return a.name.localeCompare(b.name,"nb");})};
}
// How long a raw ingredient keeps: "snart" (days), "stund" (about a week), "lenge".
var SOON=["salat","spinat","avokado","sopp","agurk","cherry","tomat","banan","edamame"];
function shelf(id){
  var g=ING[id]; if(!g) return "annet";
  if(g[1]==="kf"||SOON.indexOf(id)>=0) return "snart";
  if(g[1]==="tv"||g[1]==="fr") return "lenge";
  return "stund";
}

function qty(total,unit){
  if(unit==="g") return amt(total,unit)+" g";
  var q=amt(total,unit),w=Math.floor(q),f={0:"",0.25:"¼",0.5:"½",0.75:"¾"}[q-w];
  var txt=(w?w:"")+f;
  if(!txt) txt="¼";
  return txt+" "+(unit==="boks"&&q>1?"bokser":unit);
}

    pantry:r.pan.map(function(id){return ING[id][0];}).concat(["Salt","Pepper"])};
}

// Per portion. Recipes that use oil count one teaspoon (5 g) per portion.
function nutrition(idx,goal){
  var r=DINNERS[idx],t=[0,0,0,0];
  r.ing.forEach(function(x){
    var n=NUT[x[0]]; if(!n) throw new Error("Mangler næringsdata: "+x[0]);
    var g=scaleQ(x[0],x[1],goal)*n[0]/100;
    for(var k=0;k<4;k++) t[k]+=g*n[k+1];
  });
  if(r.pan.indexOf("olje")>=0){ t[0]+=44; t[3]+=5; }
  return {kcal:Math.round(t[0]/10)*10,p:Math.round(t[1]),k:Math.round(t[2]),f:Math.round(t[3])};
}

// Dates are local "yyyy-mm-dd" strings.
var DAYNAMES=["Søn","Man","Tir","Ons","Tor","Fre","Lør"], MONTHS=["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];
function toDate(iso){ var a=iso.split("-"); return new Date(+a[0],+a[1]-1,+a[2]); }
function toIso(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function addDays(iso,n){ var d=toDate(iso); d.setDate(d.getDate()+n); return toIso(d); }
function mondayOf(iso){ return addDays(iso,-((toDate(iso).getDay()+6)%7)); }
function dayLabel(iso){ var d=toDate(iso); return {day:DAYNAMES[d.getDay()],date:d.getDate()+". "+MONTHS[d.getMonth()]}; }
function daysBetween(a,b){ return Math.round((toDate(b)-toDate(a))/864e5); }
function weeksBetween(a,b){ return Math.round((toDate(b)-toDate(a))/6048e5); }
// Streak: one point per calendar week in which a week plan is made. A skipped week resets it.
function bumpStreak(st,today){
  st=st||{count:0,best:0,last:""};
  var wk=mondayOf(today);
  if(st.last===wk) return st;
  var gap=st.last?weeksBetween(st.last,wk):99;
  var count=gap===1?st.count+1:1;
  return {count:count,best:Math.max(st.best||0,count),last:wk};
}
function liveStreak(st,today){
  if(!st||!st.last) return {count:0,best:0,thisWeek:false,broken:false};
  var gap=weeksBetween(st.last,mondayOf(today));
  return {count:gap<=1?st.count:0,best:st.best||st.count,thisWeek:gap===0,broken:gap>1};
}

// S.fridge entries: {id (ingredient id, or "f.." for free text), name, q, week, added}.
// week = start date of the plan whose leftovers made it. Those are not used for the same plan,
// because that plan's shopping list already paid for them.
// Each week plan gets its own id, so two weeks made on the same day are still told apart.
function planKey(plan){ return plan ? (plan.pid||plan.start) : ""; }
// How fresh an item is: "ok", "sjekk" (check it) or "gammel" (not counted until you confirm it is still good).
var AGE={snart:[3,7],stund:[10,21],lenge:[9999,9999]};
function ageState(e,onDay){
  if(!ING[e.id]) return "ok";
  var lim=AGE[shelf(e.id)]||AGE.lenge,d=daysBetween(e.okDate||e.added,onDay||today());
  return d>=lim[1]?"gammel":(d>=lim[0]?"sjekk":"ok");
}
function fridgeAvail(plan){
  var a={};
  // For a menu that already exists, freshness is judged on the day it was made: the week you planned
  // never changes under you, and what it used is taken out when the week ends however old it is by then.
  var onDay=plan&&plan.start?plan.start:today();
  (S.fridge||[]).forEach(function(e){ if(ING[e.id] && e.q>0 && ageState(e,onDay)!=="gammel" && (!plan || e.week!==planKey(plan))) a[e.id]=(a[e.id]||0)+e.q; });
  return a;
}
function allocFor(plan){
  var need=totals(plan,S.persons,S.goal).items,av=fridgeAvail(plan),al={};
  for(var id in av) if(need[id]) al[id]=Math.min(av[id],need[id]);
  return al;
}
function buyList(){
  var g=grouped(S.plan,S.persons,S.goal,allocFor(S.plan)),al=S.always||[];
  g.pantry=g.pantry.filter(function(r){return al.indexOf(r.id)<0;});
  return g;
}
// Leftovers of things you count (apples, cans, packs) are rounded down: a quarter lemon rarely gets used.
function roundLeft(id,q){
  var u=ING[id]?ING[id][2]:"";
  return (u==="g"||u==="dl")?q:Math.floor(q+1e-6);
}
function addToFridge(id,q,week){
  if(!(q>0)) return;
  S.fridge=S.fridge||[]; S.fid=(S.fid||0)+1;
  S.fridge.push({e:"e"+S.fid,id:id,name:ING[id]?ING[id][0]:id,q:Math.round(q*1000)/1000,week:week,added:today()});
}
// Take what a finished week used out of the fridge, oldest first.
function consumeWeek(plan){
  var al=allocFor(plan);
  Object.keys(al).forEach(function(id){
    var left=al[id];
    (S.fridge||[]).filter(function(e){return e.id===id && e.week!==planKey(plan);})
      .sort(function(a,b){return a.added<b.added?-1:a.added>b.added?1:0;})
      .forEach(function(e){ var t=Math.min(e.q,left); e.q-=t; left-=t; });
  });
  (S.fridge||[]).forEach(function(e){ if(ING[e.id] && e.week!=="manual") e.q=roundLeft(e.id,e.q); });
  S.fridge=(S.fridge||[]).filter(function(e){ return !ING[e.id] || e.q>1e-6; });
}
function fridgeCount(){ var seen={}; (S.fridge||[]).forEach(function(e){ seen[e.id]=1; }); return Object.keys(seen).length; }
function profile(){ return {diet:S.diet,goal:S.goal,allergens:S.allergens,styles:S.styles,likes:S.likes}; }
function generate(){
  if(S.plan && S.plan.start && daysBetween(S.plan.start,today())>=7) consumeWeek(S.plan);
  var seen=(S.seen||[]).slice();
  if(S.plan) S.plan.dinners.forEach(function(i,k){ if(isFree(S.plan,k)) return; var at=seen.indexOf(i); if(at>=0) seen.splice(at,1); seen.push(i); });
  var pr=profile(),av0=fridgeAvail(null); pr.have=Object.keys(av0);
  pr.haveSoon=pr.have.filter(function(id){ return shelf(id)==="snart"; });
  S.plan=makePlan(pr,null,seen,S.plan);
  S.plan.start=today();
  S.plan.diet=S.diet;
  S.plan.pid="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  S.plan.free=freeDays(S.dinnersPerWeek||7);
  S.plan.noBf=!!S.noBf; S.plan.noLu=!!S.noLu;
  S.streak=bumpStreak(S.streak,today());
  S.seen=S.plan.fresh<7?[]:seen;
  // Own items carry over to the new week unless they were already bought.
  S.extra=(S.extra||[]).filter(function(x){ return !S.checked[x.id]; });
  S.checked={}; S.marks={};
}

// Changes the menu, then marks what changed on the shopping list and shows the notice.
function changeMenu(day,mutate,label){
  var before=listSnap(); mutate();
  var after=listSnap(),d=diffSnap(before,after),boughtMore=[],toFridge=[],notFridge=[];
  // Bought (ticked) more than the new menu needs: the rest goes to Mitt kjøleskap.
  Object.keys(before).forEach(function(id){
    if(!S.checked[id] || before[id].pantry || !ING[id]) return;
    // Only what the change freed up: a removed item gives everything you bought of it,
    // a smaller amount gives the difference. Leftovers from pack sizes are not counted (yet).
    var bought=boughtQty(id,before[id].tot),still=after[id]?after[id].tot:0;
    var left=still<=1e-9?bought:Math.min(bought-still,before[id].tot-still);
    left=roundLeft(id,left);
    if(left>(ING[id][2]==="g"?24:0.2)){
      var g=ING[id],cant=g[4]>dietLevel(S.diet)||g[3].split(" ").some(function(a){return a&&S.allergens.indexOf(a)>=0;});
      if(cant){ notFridge.push(g[0]); return; }
      addToFridge(id,left,planKey(S.plan)); toFridge.push(ING[id][0]+" "+qty(left,ING[id][2]));
    }

  d.rem.forEach(function(id){ delete S.checked[id]; delete S.marks[id]; });
  d.add.forEach(function(id){ delete S.checked[id]; S.marks[id]="ny"; });
  d.more.forEach(function(id){ if(S.checked[id]){ delete S.checked[id]; S.marks[id]="mer"; boughtMore.push(id); } });

    '<div class="group"><h3>Har alltid</h3><p class="explain">Basisvarer du alltid har, som olje og salt. De vises ikke i handlelisten.</p>'+(alw?'<div class="chips2">'+alw+'</div>':'<p class="fine">Ingen ennå. Trykk «Har alltid» i handlelisten.</p>')+'</div>'+
    '<button type="button" class="btn" data-act="closeFridge">Lukk</button></div>';
}

 laks:"laks",torsk:"torsk",fisk:"torsk",reker:"reker",kjottdeig:"kjottdeig",karbonade:"karbonade",biff:"biff",kalkun:"kalkun",melk:"melk",lettmelk:"melk",helmelk:"melk",
 ost:"gulost",norvegia:"gulost",rommme:"kesam",romme:"kesam",lettromme:"kesam",flote:"flote",fløte:"flote",yoghurt:"yoghurt",egg:"egg",smor:"olje",

 salat:"salat",spinat:"spinat",brokkoli:"brokkoli",blomkal:"blomkal",kal:"kal",agurk:"agurk",paprika:"paprika",sopp:"sopp",squash:"squash",purre:"purre",mais:"mais",erter:"erter",

 brod:"brod",brød:"brod",lefse:"tortilla",lefser:"tortilla",tortilla:"tortilla",tortillalefser:"tortilla",pitabrod:"pita",pita:"pita",hamburgerbrod:"burgerbrod",burgerbrod:"burgerbrod",knekkebrod:"knekke",
 havregryn:"havregryn",havremelk:"havredrikk",havredrikk:"havredrikk",nudler:"risnudler",risnudler:"risnudler",linser:"linser",quinoa:"quinoa",kikerter:"kikerter",

function normName(x){
  return (x||"").toLowerCase().replace(/ø/g,"o").replace(/æ/g,"ae").replace(/å/g,"a").replace(/[^a-z]/g,"");
}
// Exact name, then everyday name, then a unique ingredient whose name starts or ends with what was typed.
function unitFor(name){
  var n=normName(name); if(!n) return null;
  var id;
  for(id in ING) if(ING[id][2] && normName(ING[id][0])===n) return id;
  if(ALIAS[n] && ING[ALIAS[n]] && ING[ALIAS[n]][2]) return ALIAS[n];
  var sing=n.replace(/(ene|er|r)$/,"");
  if(sing!==n && ALIAS[sing] && ING[ALIAS[sing]] && ING[ALIAS[sing]][2]) return ALIAS[sing];
  if(n.length<4) return null;
  var hits=[]; for(id in ING){ var m=normName(ING[id][0]); if(ING[id][2] && (m.indexOf(n)===0 || m.slice(-n.length)===n)) hits.push(id); }
  return hits.length===1?hits[0]:null;
}
function openFridge(){
  fridgeOpen=true; sheet.innerHTML=fridgeHtml(); sheet.classList.add("open");
  var c=document.getElementById("fclose"); if(c) c.focus();
}
function refreshFridge(focusId){
  var p=sheet.querySelector(".panel"),top=p?p.scrollTop:0;
  sheet.innerHTML=fridgeHtml(); var p2=sheet.querySelector(".panel"); if(p2) p2.scrollTop=top;
  var f=focusId&&document.getElementById(focusId); if(f) f.focus({preventScroll:true});
}
function closeFridge(){
  if(!fridgeOpen) return;
  fridgeOpen=false; sheet.classList.remove("open"); sheet.innerHTML="";
  var y=window.scrollY; render(); window.scrollTo(0,y);
  var b=view.querySelector('[data-act="fridge"]'); if(b) b.focus({preventScroll:true});
}
function addFridgeManual(){
  var ni=document.getElementById("fname"),qi=document.getElementById("fq"); if(!ni) return;
  var name=ni.value.trim().replace(/\s+/g," "); if(!name){ ni.focus(); return; }
  var id=unitFor(name),q=parseFloat(String(qi.value).replace(",","."));
  if(id){
    if(!(q>0)){ toast("Skriv inn hvor mye du har ("+ING[id][2]+")"); qi.focus(); return; }
    addToFridge(id,q,"manual");
  } else {
    S.fridge=S.fridge||[]; S.fid=(S.fid||0)+1;
    S.fridge.push({e:"e"+S.fid,id:"f"+S.fid,name:name,q:0,week:"manual",added:today()});
  }
  save(); refreshFridge("fname");
}
sheet.addEventListener("click",function(e){ if(e.target===sheet){ closeRecipe(); closeFridge(); cancelSettings(); } });
sheet.addEventListener("input",function(e){
  if(e.target.id==="fname"){
    var id=unitFor(e.target.value),u=document.getElementById("funit"),h=document.getElementById("fhint");
    if(u) u.textContent=id?ING[id][2]:"";
    if(h) h.textContent=!e.target.value.trim()?"":(id?(normName(ING[id][0])!==normName(e.target.value)?"Lagres som "+ING[id][0]+".":""):"Ukjent vare. Den lagres, men trekkes ikke fra handlelisten.");
  }
});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var act=b.getAttribute("data-act");
  if(act==="recipe"){ openRecipe(parseInt(b.getAttribute("data-day"),10)); return; }
  if(act==="closeRecipe"){ closeRecipe(); return; }
  if(act==="closeFridge"){ closeFridge(); return; }
  if(act==="cancelSettings"){ cancelSettings(); return; }
  if(tourStep>=0 && act!=="tournext" && act!=="tourskip" && act!=="tour") endTour();
  if(act==="tournext"){ if(tourStep<TOUR.length-1){ tourStep++; showTourStep(); } else endTour(); return; }
  if(act==="tourskip"){ endTour(); return; }
  if(act==="closenotice"){ hideNotice(); return; }
  if(act==="seenew"){ hideNotice(); var f=view.querySelector(".list li.isnew"); if(f) f.scrollIntoView({behavior:"smooth",block:"center"}); return; }
  if(act==="exitdemo"){
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(err){ location.hash=""; }
    render(); window.scrollTo(0,0); return;
  }
  if(isDemo() && act!=="copy"){ toast("Dette er bare en forhåndsvisning"); return; }
  if(act==="feedback"){
    S.feedback=(S.feedback||[]).filter(function(f){return f.week!==S.plan.start;});
    S.feedback.push({week:S.plan.start,val:b.getAttribute("data-val")});
    var y0=window.scrollY; render(); window.scrollTo(0,y0); return;
  }
  if(act==="nextweek"){ generate(); save(); showLoading(); return; }
  if(act==="toggle"){
    var grp=b.getAttribute("data-group"),val=b.getAttribute("data-val");
    if(grp==="diet"||grp==="goal"){
      S[grp]=val;
      var sib=document.querySelectorAll('[data-group="'+grp+'"]');
      for(var k=0;k<sib.length;k++) sib[k].setAttribute("aria-pressed",sib[k]===b?"true":"false");
    } else {
      var arr=S[grp],ix=arr.indexOf(val);
      if(ix>=0) arr.splice(ix,1); else arr.push(val);
      b.setAttribute("aria-pressed",ix>=0?"false":"true");
      if(grp==="stores"){ var n=document.getElementById("next"); if(n) n.disabled=!S.stores.length; }
    }
    save();
  }
  else if(act==="dinners"){
    S.dinnersPerWeek=Math.min(7,Math.max(3,(S.dinnersPerWeek||7)+parseInt(b.getAttribute("data-d"),10)));
    document.getElementById("dout").textContent=S.dinnersPerWeek+" middager";
    document.getElementById("dminus").disabled=S.dinnersPerWeek<=3;
    document.getElementById("dplus").disabled=S.dinnersPerWeek>=7;
    save();
  }
  else if(act==="persons"){
    S.persons=Math.min(6,Math.max(1,S.persons+parseInt(b.getAttribute("data-d"),10)));
    var po=document.getElementById("pout"); if(po){ po.textContent=personsLabel(S.persons); document.getElementById("pminus").disabled=S.persons<=1; document.getElementById("pplus").disabled=S.persons>=6; }
    save();
  }
  else if(act==="next"){
    if(S.step===0){ S.name=S.name.trim(); if(!S.name) return; }
    if(S.step===3){ generate(); save(); showLoading(); return; }
    go(S.step+1);
  }
  else if(act==="back"){ go(Math.max(0,S.step-1)); }
  else if(act==="settings"){ openSettings(); }
  else if(act==="saveSettings"){ saveSettings(); }
  else if(act==="swap"){
    var day=parseInt(b.getAttribute("data-day"),10);
    if(swapLocked(S.plan.dinners[day])){ toast("Du har allerede handlet til denne middagen. Bruk Fjern hvis du ikke skal lage den."); return; }
    if(!S.plan.reserve.length){ toast("Ingen flere retter passer valgene dine"); return; }
    changeMenu(day,function(){ var nx=S.plan.reserve.shift(); S.plan.reserve.push(S.plan.dinners[day]); S.plan.dinners[day]=nx; });
  }
  else if(act==="rmday"){
    var rd=parseInt(b.getAttribute("data-day"),10);
    if(7-(S.plan.free||[]).length<=1){ toast("Du må ha minst én middag i uken"); return; }
    changeMenu(rd,function(){ S.plan.free=(S.plan.free||[]).concat([rd]).sort(); });
  }
  else if(act==="addday"){
    var dd=parseInt(b.getAttribute("data-day"),10);
    changeMenu(dd,function(){ S.plan.free=(S.plan.free||[]).filter(function(k){return k!==dd;}); });
  }
  else if(act==="editnote"){
    editingDay=parseInt(b.getAttribute("data-day"),10);
    var y3=window.scrollY; render(); window.scrollTo(0,y3);
    var ni=document.getElementById("note-"+editingDay); if(ni){ ni.focus({preventScroll:true}); ni.setSelectionRange(ni.value.length,ni.value.length); }
  }
  else if(act==="savenote"){ saveNote(parseInt(b.getAttribute("data-day"),10)); }
  else if(act==="cancelnote"){ var k4=editingDay; editingDay=-1; var y4=window.scrollY; render(); window.scrollTo(0,y4); var bt4=view.querySelector('[data-act="editnote"][data-day="'+k4+'"]'); if(bt4) bt4.focus({preventScroll:true}); }
  else if(act==="togglemeal"){
    var mk2=b.getAttribute("data-meal"),flag=mk2==="bf"?"noBf":"noLu",title=mk2==="bf"?"Frokost":"Lunsj";
    var turnOff=!S.plan[flag];
    changeMenu(0,function(){ S.plan[flag]=turnOff; S[flag]=turnOff; },turnOff?title+" er fjernet fra handlelisten":title+" er lagt til i handlelisten");
    var tb=view.querySelector('[data-act="togglemeal"][data-meal="'+mk2+'"]'); if(tb) tb.focus({preventScroll:true});
  }
  else if(act==="fridge"){ if(tourStep>=0) endTour(); openFridge(); }
  else if(act==="tour"){ startTour(); }
  else if(act==="addfridge"){ addFridgeManual(); }
  else if(act==="stillgood"){ var gid=b.getAttribute("data-id"); (S.fridge||[]).forEach(function(x){ if(x.id===gid) x.okDate=today(); }); save(); refreshFridge(); toast("Flott, den teller med igjen"); }
  else if(act==="rmfridge"){ var rid=b.getAttribute("data-id"); S.fridge=(S.fridge||[]).filter(function(x){return x.id!==rid;}); save(); refreshFridge(); }
  else if(act==="rmalways"){ var aid=b.getAttribute("data-id"); S.always=(S.always||[]).filter(function(x){return x!==aid;}); save(); refreshFridge(); }
  else if(act==="always"){
    e.preventDefault();
    var wid=b.getAttribute("data-id"); S.always=S.always||[]; if(S.always.indexOf(wid)<0) S.always.push(wid); delete S.checked[wid];
    var y5=window.scrollY; render(); window.scrollTo(0,y5); toast(ING[wid][0]+" vises ikke lenger. Du finner den i Mitt kjøleskap.");
  }
  else if(act==="addextra"){ addExtra(); }
  else if(act==="rmextra"){
    e.preventDefault();
    var xid=b.getAttribute("data-x");
    S.extra=(S.extra||[]).filter(function(x){return x.id!==xid;}); delete S.checked[xid];
    var y2=window.scrollY; render(); window.scrollTo(0,y2);
  }
  else if(act==="copy"){
    var txt=listText();
    try{ navigator.clipboard.writeText(txt).then(function(){toast("Listen er kopiert");},function(){toast("Kunne ikke kopiere listen her");}); }
    catch(err){ toast("Kunne ikke kopiere listen her"); }
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="sname"){ S.name=e.target.value; }
  if(e.target.id==="name"){ S.name=e.target.value; var n=document.getElementById("next"); if(n) n.disabled=!S.name.trim(); save(); }
});
document.addEventListener("change",function(e){
  var id=e.target.getAttribute && e.target.getAttribute("data-id"); if(!id) return;
  if(isDemo()){ e.target.checked=!e.target.checked; toast("Dette er bare en forhåndsvisning"); return; }
  if(e.target.checked){ S.checked[id]=1; if(S.marks && S.marks[id]){ delete S.marks[id]; var li=e.target.closest("li"); li.classList.remove("isnew"); var pl=li.querySelector(".pill"); if(pl) pl.remove(); } }
  else delete S.checked[id];
  var boxes=view.querySelectorAll(".list input"),done=0;
  for(var k=0;k<boxes.length;k++) if(boxes[k].checked) done++;
  document.getElementById("count").textContent=done+" av "+boxes.length+" varer i kurven";
  document.getElementById("progbar").style.width=(boxes.length?Math.round(done/boxes.length*100):0)+"%";
  updateLocks();
  save();
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ endTour(); closeRecipe(); closeFridge(); cancelSettings(); if(editingDay>=0 && e.target.id==="note-"+editingDay){ var kk=editingDay; editingDay=-1; render(); var bb=view.querySelector('[data-act="editnote"][data-day="'+kk+'"]'); if(bb) bb.focus(); } }
  if(e.key==="Enter" && e.target.id && e.target.id.indexOf("note-")===0){ e.preventDefault(); saveNote(parseInt(e.target.id.slice(5),10)); }
  if(e.key==="Enter" && e.target.id==="sname"){ e.preventDefault(); saveSettings(); }
  if(e.key==="Enter" && e.target.id==="name" && S.name.trim()){ S.name=S.name.trim(); go(1); }
  if(e.key==="Enter" && (e.target.id==="fname"||e.target.id==="fq")){ e.preventDefault(); if(isDemo()) toast("Dette er bare en forhåndsvisning"); else addFridgeManual(); }
  if(e.key==="Enter" && e.target.id==="extra"){ e.preventDefault(); if(isDemo()) toast("Dette er bare en forhåndsvisning"); else addExtra(); }
});

window.addEventListener("hashchange",function(){ if(S.step===4) render(); });
function pruneOld(){
  if(!S.fridge || !S.fridge.length) return 0;
  var al=S.plan?allocFor(S.plan):{},n0=S.fridge.length;
  S.fridge=S.fridge.filter(function(e){
    if(!ING[e.id] || al[e.id]>0) return true;
    var lim=AGE[shelf(e.id)]||AGE.lenge;
    return daysBetween(e.okDate||e.added,today())<lim[1]+7;
  });
  return n0-S.fridge.length;
}
if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
function start(data){
  load(data);
  var gone=S.step===4?pruneOld():0;
  render();
  if(gone) setTimeout(function(){ toast(gone+(gone===1?" gammel vare er":" gamle varer er")+" fjernet fra Mitt kjøleskap"); },400);
}
var hot=window.claude && window.claude.hot;
if(hot && hot.snapshot) hot.snapshot(function(){ return JSON.parse(JSON.stringify(S)); });
if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
