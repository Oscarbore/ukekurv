<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Feltapp">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Feltapp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: practical field tool, calm and sure
   IDEA: a sturdy work app used with gloves on, on a phone
   PICTURE: the app itself; the big stamp button leads
   COLOUR and TYPE: Leak Detector logo: deep blue, sky blue, green on white; Montserrat
   LAYOUT: one phone-width column, sticky header, summary strip and tabs */
:root{color-scheme:only light;
--bg:light-dark(#ffffff,#0c171d);--surf:light-dark(#eff6f8,#13232b);--line:light-dark(#d9e6eb,#253942);
--ink:light-dark(#2f3437,#e4eef2);--mute:light-dark(#5d686e,#94a8b2);
--water:light-dark(#26739c,#65cfe9);--waterInk:light-dark(#ffffff,#062330);
--vis:#72ce9b;--visInk:#0b3321;--sky:#65cfe9;--hot:#e8590c;--ok:light-dark(#1f7a4d,#72ce9b);--warn:light-dark(#9a5200,#ffb15c)}
:root,:root[data-theme=light],:root[data-theme=dark]{color-scheme:only light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--surf);color:var(--ink);font:16px/1.5 "Montserrat",system-ui,sans-serif;overflow-x:clip}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
header{position:sticky;top:0;z-index:5;background:var(--bg);color:var(--ink);padding:8px 14px 12px;display:flex;align-items:center;gap:10px;height:64px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#26739c 0 33.4%,#65cfe9 0 66.7%,#72ce9b 0)}
.mark{height:30px;width:auto;flex:none}.mark[hidden]{display:none}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:18px 16px 14px;margin-bottom:16px;border:1px solid var(--line)}
.hero img{width:200px;height:auto}.hero span{font-size:13px;font-weight:600;letter-spacing:.02em;color:#505050}
header .t{display:flex;flex-direction:column;line-height:1.2;overflow:hidden}
header b{font-size:17px;font-weight:700;color:var(--water);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{flex:none;background:transparent;border:0;color:var(--water);font:inherit;font-size:30px;line-height:1;width:44px;height:44px;border-radius:10px;cursor:pointer}
#back[hidden]{display:none}
main{flex:1}
.pad{padding:16px}
h2{font-size:20px;margin:24px 0 10px;font-weight:800}
h3{font-size:16px;margin:22px 0 8px;font-weight:700}
.mute{color:var(--mute)}.small{font-size:14px}
.btn{min-height:44px;border-radius:10px;border:1px solid transparent;font:inherit;font-weight:700;padding:10px 16px;cursor:pointer;background:var(--surf);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--water);color:var(--waterInk)}
.btn.vis{background:var(--vis);color:var(--visInk)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.tiny{min-height:36px;padding:6px 10px;font-size:14px}
.wide{width:100%}.wide+.wide{margin-top:8px}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.card{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer}
.card .big{font-size:18px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--surf);white-space:nowrap}
.chip.klar{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.felt{background:var(--sky);color:#062330}.chip.felt::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px;animation:p 1.6s infinite}
.sok{margin-top:12px}.chip.hoy{background:var(--hot);color:#fff}
.chip.mid{color:var(--warn)}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.sum div{background:var(--bg);padding:10px 12px}
.sum small{display:block;font-size:13px;color:var(--mute)}
.sum b{font-size:17px;white-space:nowrap}
.tabs{position:sticky;top:64px;z-index:4;display:flex;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{flex:1 0 auto;min-height:48px;padding:0 12px;border:0;border-bottom:3px solid transparent;background:none;font:inherit;font-weight:700;color:var(--mute);cursor:pointer}
.tabs .on{color:var(--ink);border-color:var(--vis)}
.n{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--hot);color:#fff;font-size:12px}
.stamp{width:100%;min-height:112px;border:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;cursor:pointer;box-shadow:0 6px 18px -8px rgba(0,0,0,.4)}
.stamp>span{font-size:26px;font-weight:800}
.stamp small{font-size:14px}
.stamp.in{background:var(--water);color:var(--waterInk)}
.stamp.out{background:var(--vis);color:var(--visInk)}
.stamp.out small::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:7px;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.stamp.out small::before,.chip.felt::before{animation:none}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.two .btn{font-size:14px;padding:8px}
.form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
label.inline{margin-top:12px}
input,select,textarea{font:inherit;font-size:16px;font-weight:400;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{font-style:italic;color:light-dark(#9aa7ad,#64808c);opacity:1}
select:has(option[value=""]:checked){font-style:italic;color:light-dark(#9aa7ad,#64808c)}
select option{font-style:normal;color:var(--ink)}
.list{list-style:none;padding:0;margin:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line)}
.okt li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center}
.okt b{white-space:nowrap}
.okt em{font-size:12px;color:var(--warn);font-style:normal}
.x{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mute);font-size:20px;cursor:pointer}
.logg li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px}
.logg time{display:flex;flex-direction:column;font-size:12px;color:var(--mute);line-height:1.2}
.logg time b{font-size:17px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chipbtn{min-height:40px;padding:6px 12px;border-radius:99px;border:1px solid var(--water);background:none;color:var(--water);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.addrow{display:flex;gap:8px;margin-bottom:12px}
.addrow input{flex:1}
.addrow select{width:auto}
details{margin-top:16px}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;color:var(--water)}
.box{border:1px solid var(--line);border-radius:14px;padding:4px 14px 14px;margin:0 0 12px}
.seg{border:0;padding:0;margin:0;display:flex;gap:8px}
.seg legend{font-weight:600;font-size:14px;margin-bottom:4px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px;min-height:0}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);border-radius:10px;font-weight:600}
.seg input:checked+span{background:var(--water);color:var(--waterInk);border-color:var(--water)}
.seg input:focus-visible+span{outline:3px solid var(--sky)}
.avvik p{margin:4px 0 8px}
.sw{position:relative;margin-bottom:10px;border-radius:14px;overflow:hidden;background:#f6ddd0}
.sw.go{background:var(--hot)}
.sw-bg{position:absolute;inset:0;display:flex;align-items:center;padding:0 22px;font-weight:700;color:#9a3a0a}
.sw.go .sw-bg{color:#fff}.sw.r .sw-bg{justify-content:flex-end}
.sw .card{margin:0;position:relative;transition:transform .2s;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.btn.danger{background:var(--hot);color:#fff}
.tip{margin:8px 0 0}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:22px 0 8px}.hrow h3{margin:0}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;padding:12px 14px;background:var(--surf);border-radius:12px}
.info dt{color:var(--mute);font-size:14px}.info dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.fakt{width:100%;border-collapse:collapse;margin-bottom:12px}
.fakt th,.fakt td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
.fakt th{width:44%;font-weight:700;background:var(--surf);font-size:14px}
.fakt td{white-space:pre-line}
.miss{color:var(--warn);font-style:italic}
.note{border-radius:12px;padding:12px 14px;margin:12px 0}
.note ul{margin:6px 0 0;padding-left:18px}
.note.warn{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.note.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.total{text-align:right;font-size:18px}
footer{border-top:1px solid var(--line)}
footer a{color:var(--water)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(4,20,27,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.dlg{background:var(--bg);color:var(--ink);border-radius:18px;padding:20px;width:100%;max-width:428px;box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}
.dlg h2{margin:0 0 8px}.dlg p{margin:0 0 6px}
.dlg .two{margin-top:16px}.dlg .btn{min-height:54px;font-size:17px}
.linkbtn{background:none;border:0;color:var(--water);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>

const tid=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dato=t=>{const d=new Date(t);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()};
const dt=t=>t?dato(t)+' '+tid(t):'–';
const timer=i=>(i.okter.reduce((a,o)=>a+(o.ut-o.inn),0)+(i.inn?Date.now()-i.inn:0))/H;
const fmtT=h=>h.toFixed(2).replace('.',',')+' t';
const dur=m=>{const mm=Math.floor(m/60000);return Math.floor(mm/60)+' t '+(mm%60)+' min'};
const kmSum=i=>i.km.reduce((a,k)=>a+(+k.km||0),0);
const periode=i=>dt(i.ut)+' – '+(i.opp?dt(i.opp):'pågår');
const cur=()=>S.insp.find(i=>i.id===S.cur);
const log=(i,x,t)=>i.logg.push({t:t||Date.now(),x});
const $=id=>document.getElementById(id);
const TYPER=['Sikkerhet/HMS','Utstyr','Tilgang/stedlige forhold','Kunde/kontraktør','Annet'];
const ALV={Lav:'lav',Middels:'mid','Høy':'hoy'};

let q='';
const hay=i=>[i.nr,i.kunde,i.strekk,i.kontraktor,i.maalesystem,i.flytekabel,i.startkum,i.endekum].join(' ').toLowerCase();
function listRes(){
 const card=i=>`<div class="sw"><div class="sw-bg">Slett</div><button class="card" data-open="${esc(i.id)}"><span class="row"><b>${esc(i.nr)}</b><span class="chip ${i.status==='klar'?'klar':(i.inn?'felt':'')}">${i.status==='klar'?'Klar til fakturering':(i.inn?'Ute i felt':'Pågår')}</span></span><span class="big">${esc(i.strekk)}</span><span class="mute small">${esc(i.kunde)} · ${fmtT(timer(i))} · ${kmSum(i)} km</span></button></div>`;
 const ord=q.trim().toLowerCase().split(/\s+/).filter(Boolean),L=S.insp.filter(i=>{const h=hay(i);return ord.every(o=>h.includes(o))});
 const a=L.filter(i=>i.status!=='klar'),k=L.filter(i=>i.status==='klar');
 if(ord.length&&!L.length)return `<p class="mute">Ingen oppdrag passer «${esc(q.trim())}».</p>`;
 return `<h2>Pågående</h2>${a.map(card).join('')||`<p class="mute">${ord.length?'Ingen treff.':'Ingen pågående inspeksjoner.'}</p>`}
 <h2>Klar til fakturering</h2>${k.map(card).join('')||`<p class="mute">${ord.length?'Ingen treff.':'Ingen ennå.'}</p>`}`;
}
function vList(){
 return `<section class="pad"><div class="hero"><img src="${LOGO}" alt="Leak Detector"><span>Feltapp</span></div><button class="btn primary wide" data-act="ny">+ Ny inspeksjon</button>
 <input type="search" id="sok" class="sok" placeholder="Søk på nr., strekk, kunde, kabel …" value="${esc(q)}" aria-label="Søk i oppdrag" autocomplete="off"><p class="mute small tip">Sveip et oppdrag til siden for å slette det.</p>
 <div id="res">${listRes()}</div></section>`;
}
const NR=/^LI-E(\d{2})(\d{2})(\d{3})$/;
const nextNr=()=>{const d=new Date(),max=S.insp.reduce((a,i)=>{const m=NR.exec(i.nr);return m?Math.max(a,+m[3]):a},0);
 return 'LI-E'+pad(d.getFullYear()%100)+pad(d.getMonth()+1)+String(max+1).padStart(3,'0')};
function vNy(){return `<form class="pad form" id="nyform">
 <label>Inspeksjonsnr.<input name="nr" required value="${nextNr()}" pattern="LI-E[0-9]{7}" title="Format: LI-EÅÅMMLLL, for eksempel LI-E2611048" autocapitalize="characters"><small class="mute" id="nrhint">Foreslått automatisk: år, måned og neste løpenummer.</small></label>
 <label>Kommune/kunde<input name="kunde" required placeholder="Sandnes kommune"></label>
 <label>Navn på strekk<input name="strekk" required placeholder="Eventyrveien A"></label>
 <label>Kontraktør<input name="kontraktor" placeholder="Entreprenøren på stedet"></label>
 <h3>Til oppdragsloggen</h3>
 <label>Målesystem${msSelect('name="maalesystem"','')}</label>
 <label>Flytekabel${pick(FK,'Velg flytekabel','name="flytekabel"','')}</label>
 <div class="two"><label>Startkum<input name="startkum" placeholder="15376"></label><label>Endekum<input name="endekum" placeholder="Fylles inn senere"></label></div>
 <button class="btn primary wide">Opprett og åpne</button></form>`}
const MS=[['Leak Detector 01'],['Leak Detector 02'],['Leak Detector 03'],['Leak Detector 04','Gjøvaag'],['Leak Detector 05'],['Leak Detector 06'],['Leak Detector 07'],
 ['Norva24 Midt 01'],['Norva24 Øst 01'],['Norva24 Sør 01'],['Norva24 Vest 01']];
const FK=['LOP1-FL8001 26020724','LOP1-FL8001 24120717','LOP1-FL8000 23040613','LOP1-FL8000 23010509','LOP1-FL8000 22070605','LOP1-FL8000 22030801',
 'LOP1-FL8001 26030725','LOP1-FL8001 26020723',
 'LOP1-FL8001 25100622','LOP1-FL8001 25060621','LOP1-FL8001 25060619','LOP1-FL8001 25060618',
 'LOP1-FL8000 23040515','LOP1-FL8000 23040612','LOP1-FL8000 22070402'].map(x=>[x]);
const msSelect=(attr,val)=>pick(MS,'Velg målesystem',attr,val);
const pick=(list,ph,attr,val)=>{const extra=val&&!list.some(x=>x[0]===val)?`<option selected>${esc(val)}</option>`:'';
 return `<select ${attr}><option value="">${ph}</option>${extra}${list.map(([v,n])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(v)}${n?' ('+n+')':''}</option>`).join('')}</select>`};
let redig=false;
function oppdrag(i,L){
 if(!redig||L){const v=x=>x?esc(x):'<span class="miss">Ikke fylt inn</span>';
  return `<div class="hrow"><h3>Til oppdragsloggen</h3>${L?'':'<button class="btn ghost tiny" data-act="redig">Rediger</button>'}</div>
  <dl class="info"><dt>Målesystem</dt><dd>${v(i.maalesystem)}</dd><dt>Flytekabel</dt><dd>${v(i.flytekabel)}</dd><dt>Startkum</dt><dd>${v(i.startkum)}</dd><dt>Endekum</dt><dd>${v(i.endekum)}</dd></dl>`}
 const f=(k,l,ph)=>`<label>${l}<input data-f="${k}" value="${esc(i[k]??'')}" placeholder="${ph}"></label>`;
 return `<div class="hrow"><h3>Til oppdragsloggen</h3><button class="btn primary tiny" data-act="ferdig">Ferdig</button></div><div class="form">
 <label>Målesystem${msSelect('data-f="maalesystem"',i.maalesystem||'')}</label>
 <label>Flytekabel${pick(FK,'Velg flytekabel','data-f="flytekabel"',i.flytekabel||'')}</label>
 <div class="two">${f('startkum','Startkum','15376')}${f('endekum','Endekum','Fylles inn')}</div></div>`}

function vInsp(i){
 const tabs=[['felt','Felt'],['logg','Logg'],['avvik','Avvik'],['km','Kjøring'],['faktura','Faktura']];
 const n=i.avvik.filter(a=>a.status!=='Lukket').length;
 const T={felt:tFelt,logg:tLogg,avvik:tAvvik,km:tKm,faktura:tFakt}[S.tab]||tFelt;
 return `<div class="sum"><div><small>Timer i felt</small><b id="sumT">${fmtT(timer(i))}</b></div><div><small>Kjøring</small><b>${kmSum(i)} km</b></div><div><small>Kabel</small><b>${i.ut?(i.opp?'Trukket opp':'Ute'):'Ikke ute'}</b></div></div>
 <nav class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${l}${k==='avvik'&&n?` <span class="n">${n}</span>`:''}</button>`).join('')}</nav>
 <section class="pad">${T(i)}</section>`;
}
function tFelt(i){
 const L=i.status==='klar';
 const stamp=L?`<div class="note ok">Klar til fakturering. Gjenåpne under Faktura for å endre.</div>`:
 (i.inn?`<button class="stamp out" data-act="ut"><span>Stemple ut</span><small>Ute i felt siden ${tid(i.inn)} · <span id="live">${dur(Date.now()-i.inn)}</span></small></button>`
 :`<button class="stamp in" data-act="inn"><span>Stemple inn</span><small>Teamleder stempler for hele teamet</small></button>`);
 const okt=i.okter.map((o,r)=>`<li><span>${dato(o.inn)}</span><span>${tid(o.inn)}–${tid(o.ut)}${o.manuell?' <em>manuelt</em>':''}</span><b>${fmtT((o.ut-o.inn)/H)}</b>${L?'<span></span>':`<button class="x" data-delokt="${r}" aria-label="Slett økt">×</button>`}</li>`).reverse().join('');
 return stamp+`<h3>Måleperiode</h3><div class="two">
 <button class="btn ghost" data-act="kabelut" ${i.ut||L?'disabled':''}>${i.ut?'Satt ut '+dt(i.ut):'Kabel satt ut'}</button>
 <button class="btn ghost" data-act="kabelopp" ${!i.ut||i.opp||L?'disabled':''}>${i.opp?'Trukket opp '+dt(i.opp):'Kabel trukket opp'}</button></div>
 <label class="inline">Antall meter<input type="number" inputmode="numeric" min="0" data-f="meter" value="${esc(i.meter??'')}" ${L?'disabled':''}></label>
 ${oppdrag(i,L)}
 <h3>Økter i felt</h3><ul class="list okt">${okt||'<li class="mute">Ingen økter ennå.</li>'}</ul>`+
 (L?'':`<details><summary>Glemt å stemple? Legg til økt</summary><div class="form"><label>Fra<input type="datetime-local" id="mfra"></label><label>Til<input type="datetime-local" id="mtil"></label><button class="btn ghost" data-act="manuell">Legg til økt</button><p class="mute small" id="merr">Manuelle økter merkes, så de kan kontrolleres.</p></div></details>`);
}
function tLogg(i){
 return `<form class="addrow" id="loggform"><input id="loggtxt" placeholder="Skriv en oppdatering …" autocomplete="off"><button class="btn primary">Legg til</button></form>
 <ul class="list logg">${i.logg.slice().sort((a,b)=>b.t-a.t).map(l=>`<li><time>${dato(l.t)}<b>${tid(l.t)}</b></time><span>${esc(l.x)}</span></li>`).join('')||'<li class="mute">Ingen oppdateringer ennå.</li>'}</ul>`;
}
function tAvvik(i){
 const li=i.avvik.map((a,r)=>`<li><div class="row"><b>${esc(a.type)}</b><span class="chip ${ALV[a.alvor]||''}">${esc(a.alvor)}</span></div><p>${esc(a.beskr)}</p><div class="row mute small"><span>${dt(a.t)}${a.bilde?' · bilde: '+esc(a.bilde):''}</span><button class="btn tiny ${a.status==='Lukket'?'ghost':'vis'}" data-avstat="${r}">${a.status==='Lukket'?'Lukket · gjenåpne':'Åpen · lukk'}</button></div></li>`).reverse().join('');
 return `<details class="box" ${i.avvik.length?'':'open'}><summary>+ Registrer avvik</summary><form class="form" id="avvikform">
 <label>Type<select name="type">${TYPER.map(t=>`<option>${t}</option>`).join('')}</select></label>
 <fieldset class="seg"><legend>Alvorlighet</legend>${Object.keys(ALV).map((a,k)=>`<label><input type="radio" name="alvor" value="${a}" ${k?'':'checked'}><span>${a}</span></label>`).join('')}</fieldset>
 <label>Beskrivelse<textarea name="beskr" rows="3" required placeholder="Hva skjedde, og hvor?"></textarea></label>
 <label>Bilde<input type="file" name="bilde" accept="image/*"></label>
 <button class="btn primary wide">Lagre avvik</button></form></details>
 <ul class="list avvik">${li||'<li class="mute">Ingen avvik registrert.</li>'}</ul>`;
}
function tKm(i){
 const li=i.km.map((k,r)=>`<li><span>${dato(k.t)}</span><span>${esc(k.bil)}</span><b>${esc(k.km)} km</b><button class="x" data-delkm="${r}" aria-label="Slett">×</button></li>`).reverse().join('');
 return `<form class="addrow" id="kmform"><select id="kmbil" aria-label="Bil"><option>Bil 1</option><option>Bil 2</option><option>Bil 3</option></select><input id="kmval" type="number" inputmode="numeric" min="1" placeholder="km" required aria-label="Kilometer"><button class="btn primary">Legg til</button></form>
 <p class="mute small">Kjøredistanse føres per bil.</p>
 <ul class="list okt">${li||'<li class="mute">Ingen kjøring registrert.</li>'}</ul>
 <p class="total">Totalt <b>${kmSum(i)} km</b></p>`;
}
const rows=i=>[['Inspeksjonsnr.',i.nr],['Kommune/kunde',i.kunde],['Navn på strekk',i.strekk],['Antall meter',i.meter?i.meter+' m':''],['Måleperiode',i.ut?periode(i):''],['Kontraktør',i.kontraktor],['L.D. Mobiliseringstimer',fmtT(timer(i))],['L.D. Kjøredistanse',kmSum(i)+' km'],['Kommentarer',i.kommentar]];
function mangler(i){
 const m=[];if(i.inn)m.push('Teamet er fortsatt stemplet inn.');
 if(!i.ut)m.push('Kabel er ikke satt ut.');else if(!i.opp)m.push('Kabel er ikke trukket opp.');
 if(!i.meter)m.push('Antall meter mangler.');if(!i.kontraktor)m.push('Kontraktør mangler.');
 const a=i.avvik.filter(x=>x.status!=='Lukket').length;if(a)m.push(a+' åpne avvik må lukkes.');return m;
}
function tFakt(i){
 const m=mangler(i),K=i.status==='klar';
 return `<table class="fakt"><tbody>${rows(i).map(([k,v])=>`<tr><th>${k}</th><td>${k==='Kommentarer'&&!K?`<textarea data-f="kommentar" rows="3" placeholder="Valgfritt">${esc(v)}</textarea>`:(esc(v)||'<span class="miss">mangler</span>')}</td></tr>`).join('')}</tbody></table>
 ${K?`<div class="note ok">Markert klar til fakturering.</div><button class="btn primary wide" data-act="kopier">Kopier fakturagrunnlag</button><p class="mute small" id="kopimsg">Kopieres som tabell, klar til å limes inn i Excel eller en e-post.</p><button class="btn ghost wide" data-act="gjenapne">Gjenåpne inspeksjonen</button>`
 :`<button class="btn ghost tiny" data-act="hentavvik">Hent avvik inn i kommentaren</button>
 ${m.length?`<div class="note warn"><b>Før fakturering:</b><ul>${m.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
 <button class="btn vis wide" data-act="klar" ${m.length?'disabled':''}>Klar til fakturering</button>${m.length?'<p class="mute small">Knappen blir aktiv når listen over er tom.</p>':''}`}`;
}
let pend=null;
function vModal(i){
 if(!pend||!i)return '';const inn=pend==='inn',n=Date.now();
 return `<div class="ov" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="dlg"><h2 id="mt">${inn?'Stemple inn?':'Stemple ut?'}</h2>
 <p>${inn?'Teamet registreres som ute i felt på':'Økten avsluttes på'} <b>${esc(i.nr)}</b> kl. ${tid(n)}.</p>
 ${inn?'':`<p class="mute small">Økten varte i ${dur(n-i.inn)} (fra kl. ${tid(i.inn)}).</p>`}
 <div class="two"><button class="btn ghost" data-act="avbryt">Avbryt</button><button class="btn ${inn?'primary':'vis'}" id="okbtn" data-act="${inn?'okinn':'okut'}">OK, stemple ${inn?'inn':'ut'}</button></div></div></div>`;
}
let lastKey='',slettId=null,sw=null,swipedAt=0;
function vSlett(){const i=slettId&&S.insp.find(x=>x.id===slettId);if(!i)return '';
 return `<div class="ov" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="dlg"><h2 id="mt">Slette inspeksjonen?</h2><p><b>${esc(i.nr)}</b> · ${esc(i.strekk)}</p><p class="mute small">Alle økter, logg, avvik og kjøring for oppdraget slettes. Dette kan ikke angres.</p><div class="two"><button class="btn ghost" id="okbtn" data-act="avbryt">Avbryt</button><button class="btn danger" data-act="slettok">Slett</button></div></div></div>`}
function toTop(){try{window.scrollTo(0,0);if(document.scrollingElement)document.scrollingElement.scrollTop=0;$('app').scrollIntoView({block:'start'})}catch(e){}}
function render(){
 let i=cur();if(S.view==='insp'&&!i)S.view='liste';
 const v=S.view||'liste';
 $('back').hidden=v==='liste';$('mark').hidden=v==='liste';
 $('ht').textContent=v==='insp'?i.nr:v==='ny'?'Ny inspeksjon':'Inspeksjoner';
 $('hs').textContent=v==='insp'?i.strekk+' · '+i.kunde:v==='ny'?'Leak Detector · feltapp':S.insp.filter(x=>x.status!=='klar').length+' pågående · '+S.insp.filter(x=>x.status==='klar').length+' klar til fakturering';
 if(v!=='insp')pend=null;
 $('main').innerHTML=v==='insp'?vInsp(i)+vModal(i):v==='ny'?vNy():vList()+vSlett();
 const key=v+'|'+(S.cur||'')+'|'+(v==='insp'?S.tab:'');if(key!==lastKey){if(lastKey)toTop();lastKey=key}
 const ok=$('okbtn');if(ok)ok.focus({preventScroll:true});
}
const go=()=>{save();render()};

document.addEventListener('click',e=>{
 if(e.target.classList.contains('ov')){pend=null;slettId=null;render();return}
 if(Date.now()-swipedAt<400&&e.target.closest('.card'))return;
 const b=e.target.closest('button');if(!b)return;
 const i=cur(),d=b.dataset;
 if(b.id==='back'||d.open||d.tab)redig=false;
 if(b.id==='back'){S.view='liste';S.cur=null;go();return}
 if(d.open){S.cur=d.open;S.view='insp';S.tab='felt';go();return}
 if(d.tab){S.tab=d.tab;go();return}
 if(!i&&!['ny','nullstill','avbryt','slettok'].includes(d.act))return;
 if(d.delokt!=null){const o=i.okter.splice(+d.delokt,1)[0];log(i,'Økt slettet: '+dt(o.inn)+'–'+tid(o.ut));go();return}
 if(d.delkm!=null){i.km.splice(+d.delkm,1);go();return}
 if(d.avstat!=null){const a=i.avvik[+d.avstat];a.status=a.status==='Lukket'?'Åpen':'Lukket';log(i,'Avvik '+(a.status==='Lukket'?'lukket':'gjenåpnet')+': '+a.type);go();return}
 const A={
  ny(){S.view='ny';S.cur=null},
  nullstill(){S=seed()},
  inn(){pend='inn'},
  ut(){pend='ut'},
  avbryt(){pend=null;slettId=null},
  slettok(){S.insp=S.insp.filter(x=>x.id!==slettId);slettId=null},
  redig(){redig=true},
  ferdig(){redig=false},
  okinn(){pend=null;if(!i.inn){i.inn=Date.now();log(i,'Stemplet inn')}},
  okut(){pend=null;if(i.inn){i.okter.push({inn:i.inn,ut:Date.now()});i.inn=null;log(i,'Stemplet ut')}},
  kabelut(){i.ut=Date.now();log(i,'Kabel satt ut')},
  kabelopp(){i.opp=Date.now();log(i,'Kabel trukket opp')},
  manuell(){const f=new Date($('mfra').value).getTime(),t=new Date($('mtil').value).getTime();
   if(!f||!t||t<=f){$('merr').textContent='Sjekk at «Til» er etter «Fra».';return 'stay'}
   i.okter.push({inn:f,ut:t,manuell:true});i.okter.sort((a,b)=>a.inn-b.inn);log(i,'Økt lagt til manuelt: '+dt(f)+'–'+tid(t))},
  hentavvik(){const t=i.avvik.length?i.avvik.map(a=>'Avvik ('+a.alvor.toLowerCase()+'): '+a.beskr).join('\n'):'Ingen avvik.';i.kommentar=(i.kommentar?i.kommentar+'\n':'')+t},
  klar(){i.status='klar';log(i,'Markert klar til fakturering')},
  gjenapne(){i.status='aktiv';log(i,'Gjenåpnet')},
  kopier(){const msg=$('kopimsg'),ok=()=>{msg.textContent='Kopiert. Lim inn i Excel med Ctrl+V.'},fail=()=>{msg.textContent='Nettleseren tillot ikke kopiering her. Marker tabellen og kopier manuelt.'};
   const num=n=>String(+(+n).toFixed(2)).replace('.',',');
   const C=[['Inspeksjonsnr.',i.nr],['Kommune/kunde',i.kunde],['Navn på strekk',i.strekk],['Antall meter',i.meter?num(i.meter):''],['Måleperiode',i.ut?periode(i):''],['Kontraktør',i.kontraktor],['L.D. Mobiliseringstimer (t)',num(timer(i))],['L.D. Kjøredistanse (km)',num(kmSum(i))],['Kommentarer',i.kommentar||'']];
   const txt=C.map(([k,v])=>k+'\t'+String(v).replace(/\s*\n\s*/g,' ')).join('\r\n');
   const b='border:1px solid #9aa9b1;padding:4px 8px;vertical-align:top;';
   const html='<table style="border-collapse:collapse;table-layout:fixed;font-family:Calibri,Arial,sans-serif;font-size:11pt"><col width="240" style="mso-width-source:userset;width:180pt"><col width="340" style="mso-width-source:userset;width:255pt">'+C.map(([k,v])=>'<tr><td style="'+b+'width:180pt;white-space:nowrap;background:#e6eef2;font-weight:bold">'+esc(k)+'</td><td style="'+b+'width:255pt;white-space:'+(k==='Kommentarer'?'normal':'nowrap')+'">'+esc(v).replace(/\n/g,'<br style="mso-data-placement:same-cell">')+'</td></tr>').join('')+'</table>';
   try{if(window.ClipboardItem&&navigator.clipboard.write){navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})})]).then(ok,()=>navigator.clipboard.writeText(txt).then(ok,fail))}else navigator.clipboard.writeText(txt).then(ok,fail)}
   catch(err){fail()}return 'stay'}
 };
 if(A[d.act]&&A[d.act]()!=='stay')go();
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,i=cur();
 if(f.id==='nyform'){const fd=new FormData(f),id='i'+Date.now(),nr=fd.get('nr').trim().toUpperCase();
  if(!NR.test(nr)){$('nrhint').textContent='Bruk formatet LI-EÅÅMMLLL, for eksempel LI-E2611048.';return}
  if(S.insp.some(x=>x.nr===nr)){$('nrhint').textContent=nr+' finnes allerede.';return}
  S.insp.unshift({id,nr,kunde:fd.get('kunde').trim(),strekk:fd.get('strekk').trim(),kontraktor:fd.get('kontraktor').trim(),maalesystem:fd.get('maalesystem').trim(),flytekabel:fd.get('flytekabel').trim(),startkum:fd.get('startkum').trim(),endekum:fd.get('endekum').trim(),meter:null,ut:null,opp:null,inn:null,okter:[],km:[],logg:[],avvik:[],status:'aktiv',kommentar:''});
  S.cur=id;S.view='insp';S.tab='felt';go();return}
 if(!i)return;
 if(f.id==='loggform'){const x=$('loggtxt').value.trim();if(x){log(i,x);go();const n=$('loggtxt');if(n)n.focus()}return}
 if(f.id==='kmform'){const k=+$('kmval').value;if(k>0){i.km.push({bil:$('kmbil').value,km:k,t:Date.now()});go()}return}
 if(f.id==='avvikform'){const fd=new FormData(f),fil=fd.get('bilde');
  i.avvik.push({t:Date.now(),type:fd.get('type'),alvor:fd.get('alvor'),beskr:fd.get('beskr').trim(),status:'Åpen',bilde:fil&&fil.name?fil.name:''});
  log(i,'Avvik registrert: '+fd.get('type'));go()}
});
document.addEventListener('change',e=>{const k=e.target.dataset.f,i=cur();if(!k||!i)return;
 i[k]=k==='meter'?(e.target.value?+e.target.value:null):e.target.value;go()});
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.sw .card');if(!c||pend||slettId)return;sw={c,x:e.clientX,y:e.clientY,dx:0,on:false,id:e.pointerId}});
document.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
 if(!sw.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){sw=null;return}if(Math.abs(dx)<10)return;sw.on=true;try{sw.c.setPointerCapture(e.pointerId)}catch(err){}sw.c.style.transition='none'}
 e.preventDefault();sw.dx=dx;sw.c.style.transform='translateX('+dx+'px)';const w=sw.c.parentElement;w.classList.toggle('r',dx<0);w.classList.toggle('go',Math.abs(dx)>90)},{passive:false});
const swEnd=(e,ok)=>{if(!sw||e.pointerId!==sw.id)return;const s=sw;sw=null;if(!s.on)return;swipedAt=Date.now();s.c.style.transition='';s.c.style.transform='';s.c.parentElement.classList.remove('go');if(ok&&Math.abs(s.dx)>90){slettId=s.c.dataset.open;render()}};
